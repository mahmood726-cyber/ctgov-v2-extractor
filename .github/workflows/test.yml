name: CT.gov extractor tests
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Validate a real posted CT.gov outcome
        run: npm run test:live
